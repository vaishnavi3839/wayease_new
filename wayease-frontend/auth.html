<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WayEase - Auth</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    .background {
      background: url('home3.png') center/cover no-repeat;
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .overlay-bg {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.2);
      z-index: -1;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="background"></div>
<div class="overlay-bg"></div>

<div class="card p-8 rounded-xl shadow-xl w-full max-w-md">

  <h1 class="text-3xl text-center text-[#87cfbe] font-bold mb-6">WayEase</h1>

  <!-- GOOGLE LOGIN -->
  <div class="mb-4 text-center">
    <div id="g_id_onload"
         data-client_id="295030173758-lgo5fvhiv76mc84e07pb77lspq35qq8s.apps.googleusercontent.com"
         data-callback="handleGoogleLogin">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline">
    </div>
  </div>

  <!-- OTP LOGIN -->
  <div class="border p-4 rounded mb-4 bg-white">
    <p class="mb-2 font-semibold">Mobile Login</p>

    <div class="flex gap-2 mb-2">
      <input id="phone" placeholder="10-digit mobile" class="flex-1 p-2 border rounded"/>
      <button onclick="sendOTP()" class="bg-black text-white px-3 rounded">Send</button>
    </div>

    <div class="flex gap-2">
      <input id="otp" placeholder="Enter OTP" class="flex-1 p-2 border rounded"/>
      <button onclick="verifyOTP()" class="bg-[#87cfbe] text-white px-3 rounded">Verify</button>
    </div>
  </div>

  <!-- LOGIN -->
  <form id="loginForm" class="space-y-4">
    <input id="loginEmail" type="email" placeholder="Email" class="w-full p-3 border rounded"/>
    <input id="loginPassword" type="password" placeholder="Password" class="w-full p-3 border rounded"/>
    <button class="bg-[#87cfbe] text-white px-3 rounded">Login</button>
  </form>

  <p class="text-center mt-4">
    Don’t have an account?
    <button onclick="showSignup()" class="text-green-500">Sign Up</button>
  </p>

  <!-- SIGNUP -->
  <div id="signup-section" class="hidden mt-4">
    <form id="signupForm" class="space-y-4">
      <input id="fullName" placeholder="Full Name" class="w-full p-3 border rounded"/>
      <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded"/>
      <input id="password" type="password" placeholder="Password" class="w-full p-3 border rounded"/>
      <button class="w-full bg-blue-400 text-white p-3 rounded">Sign Up</button>
    </form>
  </div>

</div>

<script>
const API = "/api";

// SWITCH UI
function showSignup() {
  document.getElementById("signup-section").classList.remove("hidden");
}

// GOOGLE LOGIN
async function handleGoogleLogin(response) {
  const res = await fetch(API + "/auth/google", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ token: response.credential })
  });

  const data = await res.json();

  if (!res.ok) return alert("Google login failed");

  localStorage.setItem("wayease_token", data.token);
  localStorage.setItem("userName", data.fullName);

  window.location.href = "index.html";
}

// OTP
async function sendOTP() {
  const phone = document.getElementById("phone").value;

  const res = await fetch(API + "/auth/otp/send", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ phone })
  });

  const data = await res.json();
  if (!res.ok) return alert(data.error);

  alert("OTP sent (check console)");
}

async function verifyOTP() {
  const phone = document.getElementById("phone").value;
  const code = document.getElementById("otp").value;

  const res = await fetch(API + "/auth/otp/verify", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ phone, code })
  });

  const data = await res.json();
  if (!res.ok) return alert("Invalid OTP");

  localStorage.setItem("wayease_token", data.token);
  localStorage.setItem("userName", data.fullName);

  window.location.href = "index.html";
}

// LOGIN
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  const res = await fetch(API + "/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      email: loginEmail.value,
      password: loginPassword.value
    })
  });

  const data = await res.json();
  if (!res.ok) return alert(data.error);

  localStorage.setItem("wayease_token", data.token);
  localStorage.setItem("userName", data.fullName);

  window.location.href = "index.html";
});

// SIGNUP
document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();

  const res = await fetch(API + "/signup", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      fullName: fullName.value,
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();
  if (!res.ok) return alert(data.error);

  alert("Signup successful!");
});
</script>

</body>
</html>
