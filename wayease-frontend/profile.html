<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — WayEase</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#87cfbe' }
        }
      }
    };
  </script>

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- HEADER -->
  <header class="border-b border-gray-200 bg-white sticky top-0 z-20 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
      <a href="index.html" class="text-primary font-semibold tracking-tight">← WayEase</a>

      <nav class="flex gap-4 text-sm text-gray-600">
        <a href="wishlist.html" class="hover:text-primary transition">Wishlist</a>
        <a href="itineraries.html" class="hover:text-primary transition">Trips</a>
        <a href="index.html" class="hover:text-primary transition">Home</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- PROFILE HERO -->
    <div class="rounded-2xl border border-gray-200 bg-white p-8 mb-8 shadow-sm">
      <div class="flex flex-col sm:flex-row sm:items-end gap-6">

        <div id="profile-avatar"
          class="w-24 h-24 rounded-full bg-primary/20 border-4 border-primary flex items-center justify-center text-3xl font-bold text-primary shadow-md">
          ?
        </div>

        <div class="flex-1">
          <h1 id="profile-name" class="text-3xl font-bold text-gray-800">Profile</h1>
          <p id="profile-email" class="text-gray-500 text-sm mt-1"></p>
          <p class="text-gray-400 text-xs mt-2">Travel diary & saved plans</p>
        </div>

        <div class="flex gap-6 text-center">
          <div>
            <p id="count-wishlist" class="text-2xl font-bold">0</p>
            <p class="text-xs text-gray-400">Saved</p>
          </div>
          <div>
            <p id="count-itinerary" class="text-2xl font-bold">0</p>
            <p class="text-xs text-gray-400">Trips</p>
          </div>
          <div>
            <p id="count-reviews" class="text-2xl font-bold">0</p>
            <p class="text-xs text-gray-400">Diary</p>
          </div>
        </div>

      </div>
    </div>

    <!-- TABS -->
    <div class="flex gap-2 border-b border-gray-200 mb-6 overflow-x-auto pb-1">

      <button data-tab="diary"
        class="profile-tab px-4 py-2 rounded-t-lg text-sm font-medium bg-primary text-white">
        Diary
      </button>

      <button data-tab="saved"
        class="profile-tab px-4 py-2 rounded-t-lg text-sm text-gray-500 hover:text-gray-700">
        Saved places
      </button>

      <button data-tab="trips"
        class="profile-tab px-4 py-2 rounded-t-lg text-sm text-gray-500 hover:text-gray-700">
        Itineraries
      </button>

      <!-- 🌸 VIRTUAL DIARY BUTTON -->
      <button onclick="window.location.href='virtual-diary.html'"
        class="px-4 py-2 rounded-t-lg text-sm font-medium bg-pink-100 text-pink-600 hover:bg-pink-200 transition flex items-center gap-1 shadow-sm">
        📖 Virtual Diary
      </button>

      <button data-tab="settings"
        class="profile-tab px-4 py-2 rounded-t-lg text-sm text-gray-500 hover:text-gray-700">
        Settings
      </button>

    </div>

    <!-- PANELS -->
    <section id="panel-diary" class="profile-panel">
      <p class="text-gray-500">Your travel logs.</p>
    </section>

    <section id="panel-saved" class="profile-panel hidden"></section>
    <section id="panel-trips" class="profile-panel hidden"></section>
    <section id="panel-settings" class="profile-panel hidden"></section>

  </main>

  <!-- SCRIPTS -->
  <script src="profile.js"></script>

</body>
</html>
