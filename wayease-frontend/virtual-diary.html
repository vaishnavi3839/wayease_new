  const addNewPage = () => {
    const next = Math.max(...Object.keys(pages).map(Number)) + 1;
    setPages(p => ({ ...p, [next]: newPageData() }));
    setPageNum(next);

  const handleMouseDown = (e, id, type) => {
    e.preventDefault();
    e.stopPropagation();
    if (!pageRef.current) return;
    const rect = pageRef.current.getBoundingClientRect();
    const items = type === "sticker" ? page.stickers : page.photos;
    const item = items.find(i => i.id === id);
    if (!item) return;
    setDragging({ id, type });
    setDragOffset({ x: e.clientX - rect.left - item.x, y: e.clientY - rect.top - item.y });
    setShowDeleteHint(true);
  };

  const handleTouchStart = (e, id, type) => {
    const touch = e.touches[0];
    handleMouseDown({ ...touch, preventDefault: () => {}, stopPropagation: () => {} }, id, type);
  };

  const handleMouseMove = useCallback((e) => {
    if (!dragging || !pageRef.current) return;
    const rect = pageRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width - 60, e.clientX - rect.left - dragOffset.x));
    const y = Math.max(0, Math.min(rect.height - 60, e.clientY - rect.top - dragOffset.y));
    if (dragging.type === "sticker") {
      updatePage({ stickers: page.stickers.map(s => s.id === dragging.id ? { ...s, x, y } : s) });
    } else {
      updatePage({ photos: page.photos.map(p => p.id === dragging.id ? { ...p, x, y } : p) });
    }
  }, [dragging, dragOffset, page]);

  const handleTouchMove = useCallback((e) => {
    if (!dragging) return;
    e.preventDefault();
    handleMouseMove(e.touches[0]);

          ← cover
        </button>
        <div style={{ fontFamily: "'Dancing Script', cursive", fontSize: "clamp(18px,4vw,26px)", fontWeight: 700, color: "white", textShadow: "1px 1px 4px rgba(0,0,0,0.25)", display: "flex", alignItems: "center", gap: "8px" }}>
          {theme.icon} Dear Dairy
        </div>
        <div style={{ color: "rgba(255,255,255,0.9)", fontSize: "14px", background: "rgba(255,255,255,0.2)", padding: "4px 10px", borderRadius: "10px" }}>
          pg {pageNum}/{totalPages}
        </div>
      </div>

      {/* TOOLBAR */}
      <div style={{ background: "rgba(255,255,255,0.88)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(236,72,153,0.15)", padding: "8px 10px", display: "flex", gap: "6px", flexWrap: "wrap", alignItems: "center", overflowX: "auto", flexShrink: 0 }}>
        {[
          { id: "book", icon: "📚", label: "Cover" },
          { id: "page", icon: "📄", label: "Page Style" },
          { id: "font", icon: "✍️", label: "Font" },
          { id: "stickers", icon: "🌸", label: "Stickers" },
          { id: "mood", icon: "🎭", label: "Mood" },
          { id: "weather", icon: "☀️", label: "Weather" },
        ].map(t => (
          <button key={t.id} className="tool-btn" onClick={() => setActivePanel(activePanel === t.id ? null : t.id)} style={{ background: activePanel === t.id ? "linear-gradient(135deg,#ec4899,#a855f7)" : "rgba(249,168,212,0.25)", border: "none", borderRadius: "12px", padding: "6px 12px", cursor: "pointer", fontSize: "13px", color: activePanel === t.id ? "white" : "#9d174d", fontFamily: "'Caveat', cursive", display: "flex", alignItems: "center", gap: "4px", transition: "all 0.2s", boxShadow: activePanel === t.id ? "0 3px 10px rgba(168,85,247,0.35)" : "none", whiteSpace: "nowrap", fontWeight: activePanel === t.id ? 600 : 400 }}>
            {t.icon} {t.label}
          </button>
        ))}

        <button className="tool-btn" onClick={() => fileRef.current?.click()} style={{ background: "rgba(249,168,212,0.25)", border: "none", borderRadius: "12px", padding: "6px 12px", cursor: "pointer", fontSize: "13px", color: "#9d174d", fontFamily: "'Caveat', cursive", display: "flex", alignItems: "center", gap: "4px", transition: "all 0.2s", whiteSpace: "nowrap" }}>
          📷 Photo
        </button>
        <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handlePhotoUpload} />

        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: "6px" }}>
          <button className="page-nav" onClick={() => setPageNum(p => Math.max(1, p - 1))} style={{ background: "rgba(249,168,212,0.25)", border: "none", borderRadius: "8px", padding: "4px 10px", cursor: "pointer", fontSize: "16px", transition: "all 0.2s" }}>‹</button>
          <button className="page-nav" onClick={addNewPage} style={{ background: "rgba(249,168,212,0.25)", border: "none", borderRadius: "8px", padding: "4px 10px", cursor: "pointer", fontSize: "13px", color: "#9d174d", fontFamily: "'Caveat', cursive", transition: "all 0.2s" }}>+ page</button>
          <button className="page-nav" onClick={() => setPageNum(p => Math.min(totalPages, p + 1))} style={{ background: "rgba(249,168,212,0.25)", border: "none", borderRadius: "8px", padding: "4px 10px", cursor: "pointer", fontSize: "16px", transition: "all 0.2s" }}>›</button>
        </div>
      </div>

      {/* PANEL */}
      {activePanel && (
        <div className="panel-in" style={{ background: "rgba(255,255,255,0.96)", backdropFilter: "blur(12px)", borderBottom: "1px solid rgba(236,72,153,0.12)", padding: "14px 14px 10px", maxHeight: "220px", overflowY: "auto", flexShrink: 0 }}>

          {activePanel === "book" && (
            <div>
              <div style={{ fontSize: "13px", color: "#9d174d", marginBottom: "10px", fontWeight: 600 }}>Choose your diary cover ✨</div>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                {DIARY_THEMES.map(t => (
                  <button key={t.id} onClick={() => setTheme(t)} style={{ background: t.cover, border: theme.id === t.id ? "3px solid #ec4899" : "2px solid transparent", borderRadius: "12px", padding: "8px 16px", cursor: "pointer", color: "white", fontFamily: "'Caveat', cursive", fontSize: "13px", boxShadow: theme.id === t.id ? "0 0 14px rgba(236,72,153,0.5)" : "0 2px 8px rgba(0,0,0,0.1)", transition: "all 0.2s", fontWeight: theme.id === t.id ? 700 : 400 }}>
                    {t.name}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activePanel === "page" && (
            <div>
              <div style={{ fontSize: "13px", color: "#9d174d", marginBottom: "10px", fontWeight: 600 }}>Choose page style 📄</div>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                {PAGE_STYLES.map(p => (
                  <button key={p.id} onClick={() => setPageStyle(p)} style={{ background: p.bg, border: pageStyle.id === p.id ? "2.5px solid #ec4899" : "1.5px solid rgba(0,0,0,0.12)", borderRadius: "10px", padding: "6px 14px", cursor: "pointer", color: p.textColor, fontFamily: "'Caveat', cursive", fontSize: "14px", boxShadow: pageStyle.id === p.id ? "0 0 10px rgba(236,72,153,0.4)" : "0 1px 4px rgba(0,0,0,0.08)", transition: "all 0.2s", fontWeight: pageStyle.id === p.id ? 700 : 400 }}>
                    {p.name}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activePanel === "font" && (
            <div>
              <div style={{ fontSize: "13px", color: "#9d174d", marginBottom: "10px", fontWeight: 600 }}>Choose your handwriting ✍️</div>
              <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                {FONTS.map(f => (
                  <button key={f.id} onClick={() => setFont(f)} style={{ background: font.id === f.id ? "linear-gradient(135deg,#fce7f3,#f3e8ff)" : "rgba(249,168,212,0.15)", border: font.id === f.id ? "2px solid #ec4899" : "1.5px solid rgba(236,72,153,0.2)", borderRadius: "10px", padding: "7px 16px", cursor: "pointer", color: "#9d174d", fontFamily: f.family, fontSize: "17px", boxShadow: font.id === f.id ? "0 0 10px rgba(236,72,153,0.3)" : "none", transition: "all 0.2s" }}>
                    {f.name}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activePanel === "stickers" && (
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                <div style={{ display: "flex", gap: "5px", overflowX: "auto", flex: 1, paddingBottom: "2px" }}>
                  {Object.keys(STICKER_CATS).map(cat => (
                    <button key={cat} onClick={() => setStickerCat(cat)} style={{ background: stickerCat === cat ? "linear-gradient(135deg,#ec4899,#a855f7)" : "rgba(249,168,212,0.2)", border: "none", borderRadius: "20px", padding: "4px 10px", cursor: "pointer", fontSize: "11px", color: stickerCat === cat ? "white" : "#9d174d", fontFamily: "'Caveat', cursive", whiteSpace: "nowrap", transition: "all 0.2s", flexShrink: 0 }}>
                      {cat}
                    </button>
                  ))}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "6px", marginLeft: "10px", flexShrink: 0 }}>
                  <span style={{ fontSize: "11px", color: "#9d174d" }}>size</span>
                  <input type="range" min="20" max="64" value={stickerSize} onChange={e => setStickerSize(Number(e.target.value))} style={{ width: "60px", accentColor: "#ec4899" }} />
                  <span style={{ fontSize: "16px" }}>{STICKER_CATS[stickerCat][0]}</span>
                </div>
              </div>
              <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
                {STICKER_CATS[stickerCat].map((emoji, i) => (
                  <button key={i} className="sticker-pick" onClick={() => addSticker(emoji)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: "22px", padding: "5px", transition: "transform 0.15s" }}>
                    {emoji}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activePanel === "mood" && (
            <div>
              <div style={{ fontSize: "13px", color: "#9d174d", marginBottom: "10px", fontWeight: 600 }}>How are you feeling today? 🎭</div>
              <div style={{ display: "flex", gap: "7px", flexWrap: "wrap" }}>
                {MOODS.map(m => (
                  <button key={m.label} className="mood-btn" onClick={() => { updatePage({ mood: m }); setActivePanel(null); }} style={{ background: page.mood?.label === m.label ? m.color : `${m.color}30`, border: `1.5px solid ${m.color}`, borderRadius: "12px", padding: "5px 12px", cursor: "pointer", fontFamily: "'Caveat', cursive", fontSize: "14px", color: page.mood?.label === m.label ? "#1a1a1a" : "#374151", transition: "all 0.2s", fontWeight: page.mood?.label === m.label ? 700 : 400 }}>
                    {m.emoji} {m.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {activePanel === "weather" && (
            <div>
              <div style={{ fontSize: "13px", color: "#9d174d", marginBottom: "10px", fontWeight: 600 }}>Today's weather ☀️</div>
              <div style={{ display: "flex", gap: "7px", flexWrap: "wrap" }}>
                {WEATHER.map(w => (
                  <button key={w} onClick={() => { updatePage({ weather: w }); setActivePanel(null); }} style={{ background: page.weather === w ? "linear-gradient(135deg,#fce7f3,#f3e8ff)" : "rgba(249,168,212,0.15)", border: page.weather === w ? "2px solid #ec4899" : "1.5px solid rgba(236,72,153,0.2)", borderRadius: "12px", padding: "6px 14px", cursor: "pointer", fontFamily: "'Caveat', cursive", fontSize: "15px", color: "#9d174d", transition: "all 0.2s" }}>
                    {w}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* MAIN JOURNAL PAGE */}
      <div style={{ flex: 1, padding: "14px 12px", display: "flex", justifyContent: "center", overflowY: "auto" }}>
        <div ref={pageRef} style={{ width: "min(580px, 100%)", minHeight: "680px", background: pageStyle.bg, borderRadius: "4px 14px 14px 4px", boxShadow: "6px 8px 30px rgba(0,0,0,0.14), -2px 0 0 rgba(0,0,0,0.04), inset 0 0 0 1px rgba(0,0,0,0.04)", position: "relative", overflow: "hidden" }}>

          {/* Paper lines */}
          {renderPageLines()}

          {/* Margin line */}
          <div style={{ position: "absolute", left: "56px", top: 0, bottom: 0, width: "1.5px", background: pageStyle.marginColor, pointerEvents: "none", zIndex: 1 }} />

          {/* Spine detail */}
          <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: "8px", background: `${pageStyle.lineColor}`, zIndex: 2 }} />

          {/* Page header zone */}
          <div style={{ padding: "16px 18px 8px 66px", position: "relative", zIndex: 3 }}>
            {/* Title input */}
            <input value={page.title || ""} onChange={e => updatePage({ title: e.target.value })} placeholder="✨ give this page a title..." style={{ width: "100%", background: "transparent", border: "none", outline: "none", fontFamily: font.family, fontSize: "clamp(18px,4vw,24px)", color: pageStyle.textColor, fontWeight: 700, marginBottom: "6px", boxSizing: "border-box", userSelect: "text" }} />

            <div style={{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap", borderBottom: `1.5px solid ${pageStyle.lineColor}`, paddingBottom: "8px", marginBottom: "4px" }}>
              <div style={{ fontFamily: "'Kalam', cursive", fontSize: "13px", color: pageStyle.textColor, opacity: 0.55 }}>{dateStr}</div>
              {page.weather && <div style={{ fontSize: "12px", background: "rgba(255,255,255,0.5)", borderRadius: "12px", padding: "2px 8px", color: pageStyle.textColor, opacity: 0.8 }}>{page.weather}</div>}
              {page.mood && (
                <div style={{ display: "inline-flex", alignItems: "center", gap: "4px", background: `${page.mood.color}30`, border: `1px solid ${page.mood.color}`, borderRadius: "20px", padding: "2px 10px", fontSize: "13px", color: pageStyle.textColor }}>
                  {page.mood.emoji} {page.mood.label}
                </div>
              )}
              <div style={{ marginLeft: "auto", fontSize: "12px", color: pageStyle.textColor, opacity: 0.35 }}>pg {pageNum}</div>
            </div>

            {/* Quote */}
            <div style={{ fontSize: "11px", color: pageStyle.textColor, opacity: 0.45, fontStyle: "italic", fontFamily: "'Kalam', cursive", padding: "3px 0 4px" }}>{quote}</div>
          </div>

          {/* Writing area */}
          <div style={{ padding: "0 18px 24px 66px", position: "relative", zIndex: 3 }}>
            <textarea ref={textRef} value={page.text || ""} onChange={e => updatePage({ text: e.target.value })} placeholder={"Dear Dairy,\n\nToday I want to tell you about..."} style={{ width: "100%", minHeight: "460px", fontFamily: font.family, fontSize: `${font.size}px`, lineHeight: "32px", color: pageStyle.textColor, caretColor: "#ec4899", boxSizing: "border-box", padding: 0 }} />
          </div>

          {/* Placed Stickers */}
          {(page.stickers || []).map(s => (
            <div key={s.id} onMouseDown={e => handleMouseDown(e, s.id, "sticker")} onTouchStart={e => handleTouchStart(e, s.id, "sticker")} onDoubleClick={() => removeSticker(s.id)} style={{ position: "absolute", left: s.x, top: s.y, fontSize: `${s.size}px`, cursor: dragging?.id === s.id ? "grabbing" : "grab", zIndex: 20, lineHeight: 1, userSelect: "none", transform: `rotate(${s.rotation}deg)`, transition: dragging?.id === s.id ? "none" : "transform 0.1s", filter: "drop-shadow(2px 2px 4px rgba(0,0,0,0.15))" }} title="Double-click to remove">
              {s.emoji}
            </div>
          ))}

          {/* Placed Photos */}
          {(page.photos || []).map(ph => (
            <div key={ph.id} onMouseDown={e => handleMouseDown(e, ph.id, "photo")} onTouchStart={e => handleTouchStart(e, ph.id, "photo")} onDoubleClick={() => removePhoto(ph.id)} style={{ position: "absolute", left: ph.x, top: ph.y, transform: `rotate(${ph.rotation}deg)`, cursor: dragging?.id === ph.id ? "grabbing" : "grab", zIndex: 21, background: "white", padding: "7px 7px 26px 7px", boxShadow: "3px 4px 14px rgba(0,0,0,0.2)", userSelect: "none", width: ph.width + "px", transition: dragging?.id === ph.id ? "none" : "box-shadow 0.2s" }} title="Double-click to remove">
              <img src={ph.src} alt="" style={{ width: "100%", display: "block", pointerEvents: "none" }} />
              <div style={{ textAlign: "center", fontSize: "12px", fontFamily: "'Caveat', cursive", color: "#555", marginTop: "4px", fontStyle: "italic" }}>{ph.caption}</div>
            </div>
          ))}

          {/* Decorative corner watermark */}
          <div style={{ position: "absolute", bottom: "16px", right: "16px", fontSize: "56px", opacity: 0.05, pointerEvents: "none", transform: "rotate(-15deg)" }}>{theme.icon}</div>

          {/* Washi tape top */}
          <div style={{ position: "absolute", top: "-4px", left: "40%", width: "80px", height: "22px", background: `${theme.accent}55`, transform: "rotate(-1deg)", borderRadius: "2px", pointerEvents: "none", zIndex: 25, border: `1px solid ${theme.accent}33` }} />
        </div>
      </div>

      {/* STATUS BAR */}
      <div style={{ background: "rgba(255,255,255,0.82)", backdropFilter: "blur(10px)", borderTop: "1px solid rgba(236,72,153,0.12)", padding: "7px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: "12px", color: "#9d174d", fontFamily: "'Caveat', cursive", flexShrink: 0, gap: "8px", flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
          <span>✨ drag stickers & photos</span>
          <span style={{ opacity: 0.5 }}>|</span>
          <span>💖 double-click to remove</span>
        </div>
        <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
          <span style={{ opacity: 0.6 }}>{(page.stickers || []).length} stickers · {(page.photos || []).length} photos</span>
          <span style={{ opacity: 0.5 }}>|</span>
          <span>{(page.text || "").split(/\s+/).filter(Boolean).length} words 📝</span>
        </div>
      </div>
    </div>
  );
}




// KEEP EVERYTHING ELSE SAME

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<DearDairy />);

</script>
</body>
</html>
