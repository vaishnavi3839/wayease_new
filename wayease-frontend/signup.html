<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WayEase - Sign Up</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#87cfbe',
            secondary: '#f8f8f8'
          },
          borderRadius: {
            'none': '0px',
            'sm': '4px',
            DEFAULT: '8px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
            'button': '8px'
          },
          fontFamily: {
            pacifico: ['Pacifico', 'cursive']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }
    .background-container {
      background-image: url('home3.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: -2;
    }
    .background-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }
    .overlay {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div class="background-container"></div>
  <div class="background-overlay"></div>

  <div class="overlay p-6 rounded-2xl shadow-xl w-full max-w-md">
    <h1 class="text-3xl font-pacifico text-center text-primary mb-6">WayEase</h1>
    <h2 class="text-xl font-semibold text-center text-gray-700 mb-8">Create an Account</h2>

    <form class="space-y-6">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Full Name</label>
        <input type="text" placeholder="Enter your full name" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="email" placeholder="Enter your email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" placeholder="Create a password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Confirm Password</label>
        <input type="password" placeholder="Confirm your password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" />
      </div>

      <button type="submit" class="w-full bg-primary text-white font-semibold py-3 rounded-button hover:bg-opacity-90 transition-all">
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-6">
      Already have an account?
      <a href="login.html" class="text-primary font-medium hover:underline">Login</a>
    </p>
  </div>

</body>
</html>
