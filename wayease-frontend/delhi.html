<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Delhi - Discover Amazing Places</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#87cfbe',secondary:'#10B981'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
:where([class^="ri-"])::before { content: "\f3c2"; }
body {
font-family: 'Inter', sans-serif;
background-color: #f8fafc;
}
.scrollbar-hide::-webkit-scrollbar {
display: none;
}
.scrollbar-hide {
-ms-overflow-style: none;
scrollbar-width: none;
}
input[type="range"]::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
width: 20px;
height: 20px;
border-radius: 50%;
background: #87cfbe;
cursor: pointer;
border: 3px solid white;
box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
}
.custom-checkbox {
position: relative;
display: inline-block;
width: 20px;
height: 20px;
}
.custom-checkbox input {
opacity: 0;
width: 0;
height: 0;
}
.checkmark {
position: absolute;
top: 0;
left: 0;
width: 20px;
height: 20px;
background-color: white;
border: 2px solid #e5e7eb;
border-radius: 4px;
transition: all 0.2s ease;
}
.custom-checkbox input:checked ~ .checkmark {
background-color: #87cfbe;
border-color: #87cfbe;
}
.checkmark:after {
content: "";
position: absolute;
display: none;
}
.custom-checkbox input:checked ~ .checkmark:after {
display: block;
left: 6px;
top: 2px;
width: 5px;
height: 10px;
border: solid white;
border-width: 0 2px 2px 0;
transform: rotate(45deg);
}
.toggle-switch {
position: relative;
display: inline-block;
width: 44px;
height: 24px;
}
.toggle-switch input {
opacity: 0;
width: 0;
height: 0;
}
.toggle-slider {
position: absolute;
cursor: pointer;
top: 0;
left: 0;
right: 0;
bottom: 0;
background-color: #e5e7eb;
transition: .4s;
border-radius: 34px;
}
.toggle-slider:before {
position: absolute;
content: "";
height: 18px;
width: 18px;
left: 3px;
bottom: 3px;
background-color: white;
transition: .4s;
border-radius: 50%;
}
input:checked + .toggle-slider {
background-color: #87cfbe;
}
input:checked + .toggle-slider:before {
transform: translateX(20px);
}
</style>
</head>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<body data-city="Delhi">
<!-- Header Section -->
<header class="sticky top-0 z-50 bg-white shadow-sm">
<div class="container mx-auto px-4 py-4">
<div class="flex items-center justify-between">
<h1 class="text-2xl font-bold text-gray-800">Explore <span class="text-primary">Delhi</span></h1>
<div class="flex items-center space-x-4">
<div class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100">
<i class="ri-notification-3-line text-gray-600"></i>
</div>
<div class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white">
<i class="ri-user-line"></i>
</div>
</div>
</div>

<!-- Search Bar -->
<div class="mt-4 relative">
<div class="relative flex items-center">
<div class="absolute left-3 w-5 h-5 flex items-center justify-center text-gray-400">
<i class="ri-search-line"></i>
</div>
<input type="text" id="city-page-search" placeholder="Search places in Delhi..." class="w-full pl-10 pr-4 py-3 bg-gray-50 border-none rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20">
<div class="absolute right-3 w-5 h-5 flex items-center justify-center text-gray-400">
<i class="ri-mic-line"></i>
</div>
</div>
</div>
<!-- Filter Options -->
<div class="mt-4 flex items-center space-x-2 overflow-x-auto scrollbar-hide pb-2">
<button class="px-4 py-2 bg-primary text-white rounded-full text-sm whitespace-nowrap !rounded-button">All Places</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Historical</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Food</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Shopping</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Religious</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Parks</button>
<button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm whitespace-nowrap !rounded-button">Entertainment</button>
</div>
</div>
</header>
<main class="container mx-auto px-4 pb-10">
<!-- Featured Places Carousel -->
<section class="mt-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-bold text-gray-800">Featured Places</h2>
      <a href="all-places.html?city=Delhi" class="text-[#87cfbe] text-sm font-medium hover:underline">View All</a>
    </div>
    <div id="featured-carousel"></div>
  </section>
<!-- Categories Grid -->
<section class="mt-8">
<h2 class="text-xl font-bold text-gray-800 mb-4">Explore by Category</h2>
<div class="grid grid-cols-3 sm:grid-cols-4 gap-4" id="category-grid">
<!-- Category 1 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-primary/10 rounded-full mb-2">
<i class="ri-building-4-line text-primary text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Historical</span>
</div>
<!-- Category 2 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-orange-100 rounded-full mb-2">
<i class="ri-restaurant-line text-orange-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Street Food</span>
</div>
<!-- Category 3 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-blue-100 rounded-full mb-2">
<i class="ri-shopping-bag-3-line text-blue-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Shopping</span>
</div>
<!-- Category 4 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-green-100 rounded-full mb-2">
<i class="ri-plant-line text-green-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Parks</span>
</div>
<!-- Category 5 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-purple-100 rounded-full mb-2">
<i class="ri-building-2-line text-purple-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Religious</span>
</div>
<!-- Category 6 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-pink-100 rounded-full mb-2">
<i class="ri-film-line text-pink-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Entertainment</span>
</div>
<!-- Category 7 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-yellow-100 rounded-full mb-2">
<i class="ri-hotel-line text-yellow-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">Hotels</span>
</div>
<!-- Category 8 -->
<div class="bg-white rounded-lg shadow-sm p-4 flex flex-col items-center">
<div class="w-12 h-12 flex items-center justify-center bg-gray-100 rounded-full mb-2">
<i class="ri-more-2-fill text-gray-500 text-xl"></i>
</div>
<span class="text-sm font-medium text-gray-700">More</span>
</div>
</div>
</section>
<!-- Nearby Places Section with Map Toggle -->
<section class="mt-8">
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-bold text-gray-800">Nearby Places</h2>
<div class="flex items-center">
<span class="text-sm text-gray-600 mr-2">Map View</span>
<label class="toggle-switch">
<input type="checkbox" id="mapToggle">
<span class="toggle-slider"></span>
</label>
</div>
</div>
<!-- Map View (Hidden by default) -->
<div id="mapView" class="hidden h-64 rounded-lg overflow-hidden mb-4 relative z-0">
<div id="leaflet-map" class="w-full h-full bg-gray-200"></div>
</div>
<!-- Distance Filter -->
<div class="bg-white rounded-lg shadow-sm p-4 mb-4">
<div class="flex items-center justify-between mb-2">
<span class="text-sm font-medium text-gray-700">Distance</span>
<span class="text-sm text-primary" id="distanceValue">5 km</span>
</div>
<input type="range" min="1" max="20" value="5" class="w-full h-2 bg-gray-200 rounded-full appearance-none" id="distanceRange">
</div>
<!-- Nearby Places List -->
<div class="space-y-4" id="places-container"></div>
<button type="button" id="load-more-places" class="w-full py-3 mt-4 text-gray-600 bg-gray-100 rounded-lg font-medium !rounded-button whitespace-nowrap hidden">Load More Places</button>
</section>
<!-- Trending Places Section -->
<section class="mt-8">
<h2 class="text-xl font-bold text-gray-800 mb-4">Trending in Delhi</h2>
<div class="space-y-4" id="trending-container"></div>
</section>
</main>
<div id="wayease-footer-root"></div>
<script src="app.js"></script>
<script src="city-page.js"></script>
<script src="footer.js"></script>
</body>
</html>
